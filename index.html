<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CrossRoute · 高雄港冷鏈數位孿生平台 (Yulon CMC-ET35 Digital Twin)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="stage" aria-label="Interactive 3D Digital Twin Stage. Drag or WASD to pan, scroll to zoom."></canvas>
  <div id="pins" aria-live="polite"></div>

  <header class="hud-top">
    <div class="brand">
      CROSSROUTE <span>/ 高雄港冷鏈數位孿生系統</span>
    </div>
    <div class="kpis">
      <div class="kpi"><label>Core Temp</label><b id="k-temp">-18.5°C</b></div>
      <div class="kpi"><label>Tractor SoC</label><b id="k-soc">82%</b></div>
      <div class="kpi"><label>Status</label><b id="k-status" class="ok">NOMINAL</b></div>
    </div>
  </header>

  <aside id="drawer" class="drawer">
    <div class="drawer-head">
      <span class="eyebrow">情境切換 SCENARIO <i id="s-idx">1</i>/5</span>
      <h2 id="s-title"></h2>
    </div>
    <p id="s-body"></p>
    <ul id="s-events" class="events"></ul>
    <ol id="s-steps" class="steps"></ol>
    <div class="drawer-nav">
      <button id="prev">← 上一個情境</button>
      <button id="next" class="primary">下一個情境 →</button>
    </div>
  </aside>

  <div class="hint">滑鼠拖曳旋轉 · 右鍵或 WASD 平移 · 滾輪縮放 · 點擊標籤聚焦部件 · 按 <kbd>R</kbd> 重設視角</div>

  <script type="module" src="./port-scene.js"></script>
</body>
</html>
